<!-- Backdrop + modal wrapper — hidden when closed -->
<div *ngIf="isOpen"
     class="fixed inset-0 z-50 flex items-center justify-center p-4"
     [ngClass]="visible ? 'backdrop-visible' : 'backdrop-hidden'">

  <!-- Blurred backdrop, click to close -->
  <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm"
       (click)="close()"></div>

  <!-- Modal panel -->
  <div class="modal-panel relative w-full max-w-lg bg-white rounded-2xl shadow-xl overflow-hidden"
       [ngClass]="visible ? 'panel-visible' : 'panel-hidden'">

    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
      <div>
        <h2 class="font-semibold text-slate-900">Upload document</h2>
        <p class="text-xs text-slate-400 mt-0.5">Supported formats: PDF, JPG, PNG, DOCX</p>
      </div>
      <button (click)="close()"
              class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400
                     hover:text-slate-600 hover:bg-slate-100 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="p-6 space-y-5">

      <!-- Drag & drop zone -->
      <div class="drop-zone rounded-xl border-2 border-dashed px-6 py-10 text-center cursor-pointer
                  transition-all duration-200 select-none"
           [ngClass]="isDragging
             ? 'border-indigo-400 bg-indigo-50'
             : 'border-slate-200 bg-slate-50 hover:border-indigo-300 hover:bg-indigo-50/40'"
           (dragover)="onDragOver($event)"
           (dragleave)="onDragLeave()"
           (drop)="onDrop($event)"
           (click)="fileInput.click()">

        <div class="flex flex-col items-center gap-2 pointer-events-none">
          <div class="w-12 h-12 rounded-xl flex items-center justify-center transition-colors"
               [ngClass]="isDragging ? 'bg-indigo-100' : 'bg-white shadow-sm'">
            <svg class="w-6 h-6 transition-colors"
                 [ngClass]="isDragging ? 'text-indigo-600' : 'text-slate-400'"
                 fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5"/>
            </svg>
          </div>
          <p class="text-sm font-medium text-slate-700">
            {{ isDragging ? 'Drop files here' : 'Drag & drop files here' }}
          </p>
          <p class="text-xs text-slate-400">or <span class="text-indigo-600 font-medium">browse</span> to select</p>
        </div>

        <!-- Hidden file input -->
        <input #fileInput type="file" multiple class="hidden"
               accept=".pdf,.jpg,.jpeg,.png,.docx"
               (change)="onFileInput($event)">
      </div>

      <!-- Document type selector -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">
          Document type <span class="text-red-400">*</span>
        </label>
        <select [(ngModel)]="selectedType"
                class="w-full text-sm text-slate-700 bg-white border border-slate-200 rounded-lg px-3 py-2.5
                       focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent
                       transition cursor-pointer">
          <option value="" disabled>Select a type…</option>
          <option *ngFor="let t of docTypes" [value]="t">{{ t }}</option>
        </select>
      </div>

      <!-- Pending files list -->
      <div *ngIf="pending.length" class="space-y-2">
        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">
          Selected files ({{ pending.length }})
        </p>

        <div *ngFor="let p of pending; let i = index"
             class="flex items-center gap-3 px-3 py-2.5 rounded-lg border transition-colors"
             [ngClass]="p.status === 'done'
               ? 'border-emerald-200 bg-emerald-50'
               : 'border-slate-100 bg-white'">

          <!-- File type badge -->
          <span class="text-xs font-bold px-1.5 py-0.5 rounded shrink-0"
                [ngClass]="p.status === 'done'
                  ? 'bg-emerald-100 text-emerald-700'
                  : 'bg-indigo-50 text-indigo-600'">
            {{ fileExt(p.file) }}
          </span>

          <!-- Name + progress -->
          <div class="flex-1 min-w-0">
            <p class="text-xs font-medium text-slate-700 truncate">{{ p.file.name }}</p>
            <!-- Progress bar (visible while uploading) -->
            <div *ngIf="p.status === 'uploading' || p.status === 'done'"
                 class="mt-1 w-full bg-slate-100 rounded-full h-1">
              <div class="h-1 rounded-full transition-all duration-150"
                   [ngClass]="p.status === 'done' ? 'bg-emerald-500' : 'bg-indigo-500'"
                   [style.width.%]="p.progress"></div>
            </div>
          </div>

          <!-- Right side: done check OR remove button -->
          <div class="shrink-0">
            <!-- Success checkmark -->
            <svg *ngIf="p.status === 'done'"
                 class="w-4 h-4 text-emerald-500"
                 fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75 10.5 18.75 19.5 5.25"/>
            </svg>
            <!-- Remove button (only when idle) -->
            <button *ngIf="p.status === 'idle'"
                    (click)="removeFile(i)"
                    class="w-5 h-5 flex items-center justify-center rounded text-slate-300
                           hover:text-red-400 hover:bg-red-50 transition">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>

        </div>
      </div>

    </div>

    <!-- Footer actions -->
    <div class="flex items-center justify-between px-6 py-4 border-t border-slate-100 bg-slate-50">
      <button (click)="close()"
              class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-800 transition">
        Cancel
      </button>

      <button (click)="upload()"
              [disabled]="!canUpload"
              class="flex items-center gap-2 px-5 py-2 rounded-lg text-sm font-semibold
                     transition-all duration-200"
              [ngClass]="canUpload
                ? 'bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm hover:shadow-md'
                : 'bg-slate-100 text-slate-400 cursor-not-allowed'">

        <!-- Spinner while uploading -->
        <svg *ngIf="uploading && !allDone"
             class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10"
                  stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>

        <!-- Done check -->
        <svg *ngIf="allDone"
             class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75 10.5 18.75 19.5 5.25"/>
        </svg>

        {{ uploading && !allDone ? 'Uploading…' : allDone ? 'Done!' : 'Upload files' }}
      </button>
    </div>

  </div>
</div>
