<div class="flex items-center justify-between px-6 py-4 hover:bg-slate-50 transition">

  <!-- File icon + name/meta -->
  <div class="flex items-center gap-4">
    <div class="w-10 h-10 rounded-lg bg-indigo-50 flex items-center justify-center shrink-0">
      <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/>
      </svg>
    </div>
    <div>
      <p class="text-sm font-medium text-slate-800">{{ doc.name }}</p>
      <p class="text-xs text-slate-400 mt-0.5">{{ doc.type }} · {{ doc.size }} · {{ doc.date }}</p>
    </div>
  </div>

  <!-- Status badge + download action -->
  <div class="flex items-center gap-3">
    <span class="text-xs font-semibold px-2 py-0.5 rounded-full"
          [ngClass]="doc.status === 'Verified'
            ? 'bg-emerald-50 text-emerald-700'
            : 'bg-amber-50 text-amber-700'">
      {{ doc.status }}
    </span>
    <button class="text-slate-300 hover:text-slate-500 transition" aria-label="Download">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/>
      </svg>
    </button>
  </div>

</div>
