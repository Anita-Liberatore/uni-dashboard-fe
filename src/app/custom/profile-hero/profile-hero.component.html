<div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6 mb-6">
  <div class="flex items-center gap-5">

    <!-- Avatar with computed initials -->
    <div class="w-16 h-16 rounded-2xl bg-indigo-600 flex items-center justify-center
                text-white text-xl font-bold shrink-0">
      {{ initials }}
    </div>

    <!-- Name, area, status -->
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-3 flex-wrap">
        <h2 class="text-xl font-bold text-slate-900">
          {{ student.name }} {{ student.surname }}
        </h2>
        <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700">
          Iscritto/a
        </span>
      </div>
      <p class="text-sm text-slate-500 mt-0.5">
        {{ student.area }} · Anno {{ student.year }} · {{ student.studentId }}
      </p>
    </div>

    <!-- Quick stats (hidden on mobile) -->
    <div class="hidden md:flex items-center gap-6 shrink-0">
      <div class="text-center">
        <p class="text-xl font-bold text-slate-900">{{ academic.gpa }}</p>
        <p class="text-xs text-slate-400">Media</p>
      </div>
      <div class="w-px h-8 bg-slate-100"></div>
      <div class="text-center">
        <p class="text-xl font-bold text-slate-900">{{ academic.credits.current }}</p>
        <p class="text-xs text-slate-400">CFU</p>
      </div>
      <div class="w-px h-8 bg-slate-100"></div>
      <div class="text-center">
        <p class="text-xl font-bold text-slate-900">{{ academic.courses.current }}</p>
        <p class="text-xs text-slate-400">Esami</p>
      </div>
    </div>

  </div>
</div>
