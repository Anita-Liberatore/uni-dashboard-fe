<table class="w-full">
  <thead>
    <tr class="bg-slate-50 text-xs font-semibold text-slate-400 uppercase tracking-wider">
      <th class="text-left px-6 py-3">Course</th>
      <th class="text-left px-6 py-3">Area</th>
      <th class="text-left px-6 py-3">Date</th>
      <th class="text-left px-6 py-3">Credits</th>
      <th class="text-left px-6 py-3">Grade</th>
      <th class="text-left px-6 py-3">Score</th>
    </tr>
  </thead>
  <tbody class="divide-y divide-slate-50">
    <tr *ngFor="let e of exams" class="hover:bg-slate-50 transition-colors">

      <td class="px-6 py-4">
        <div class="flex items-center gap-2">
          <p class="text-sm font-medium text-slate-800">{{ e.course }}</p>
          <span *ngIf="e.lode"
                class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded">
            Honors
          </span>
        </div>
      </td>

      <td class="px-6 py-4 text-sm text-slate-500">{{ e.area }}</td>
      <td class="px-6 py-4 text-sm text-slate-500">{{ e.date }}</td>
      <td class="px-6 py-4 text-sm font-medium text-slate-700">{{ e.credits }}</td>

      <td class="px-6 py-4">
        <app-grade-badge [grade]="e.grade" [lode]="e.lode"></app-grade-badge>
      </td>

      <!-- Visual score bar -->
      <td class="px-6 py-4">
        <div class="flex items-center gap-2">
          <div class="w-24 bg-slate-100 rounded-full h-1.5">
            <div class="h-1.5 rounded-full"
                 [ngClass]="barClass(e.grade)"
                 [style.width.%]="(e.grade / 30) * 100"></div>
          </div>
          <span class="text-xs text-slate-400">{{ ((e.grade / 30) * 100).toFixed(0) }}%</span>
        </div>
      </td>

    </tr>
  </tbody>
</table>
