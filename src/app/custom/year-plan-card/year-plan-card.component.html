<div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">

  <!-- Year header with progress -->
  <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
    <div class="flex items-center gap-3">
      <span class="text-xs font-bold px-2.5 py-1 rounded-lg" [ngClass]="pillClass">
        Year {{ year.year }}
      </span>
      <span class="text-sm text-slate-500">
        {{ passedCount }}/{{ year.courses.length }} courses passed ·
        {{ earnedCredits }}/{{ totalCredits }} credits
      </span>
    </div>
    <div class="flex items-center gap-3">
      <div class="w-32 bg-slate-100 rounded-full h-1.5">
        <div class="h-1.5 rounded-full" [ngClass]="barClass" [style.width.%]="progress"></div>
      </div>
      <span class="text-xs font-semibold text-slate-500 w-8 text-right">{{ progress }}%</span>
    </div>
  </div>

  <!-- Two-column semester layout -->
  <div class="grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-slate-50">
    <div *ngFor="let sem of [1, 2]" class="p-5">
      <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">
        Semester {{ sem }}
      </p>
      <div class="space-y-2">
        <div *ngFor="let c of bySemester(sem)"
             class="flex items-center justify-between gap-3 py-2 px-3 rounded-lg"
             [ngClass]="c.passed ? 'bg-slate-50' : 'border border-slate-100'">
          <!-- Status indicator dot + course name -->
          <div class="flex items-center gap-2.5 min-w-0">
            <div class="w-1.5 h-1.5 rounded-full shrink-0"
                 [ngClass]="c.passed ? 'bg-emerald-400' : 'bg-slate-300'"></div>
            <p class="text-sm text-slate-700 truncate">{{ c.name }}</p>
          </div>
          <!-- Credits + grade badge -->
          <div class="flex items-center gap-2 shrink-0">
            <span class="text-xs text-slate-400">{{ c.credits }} cr</span>
            <app-grade-badge *ngIf="c.passed && c.grade" [grade]="c.grade!" [lode]="!!c.lode">
            </app-grade-badge>
            <span *ngIf="!c.passed"
                  class="text-xs text-slate-300 bg-slate-100 px-1.5 py-0.5 rounded">—</span>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
