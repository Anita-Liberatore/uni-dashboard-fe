<aside class="fixed inset-y-0 left-0 w-64 bg-slate-900 flex flex-col z-30">

  <!-- ── Logo ── -->
  <div class="flex items-center gap-3 px-5 py-5 border-b border-white/5">
    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-indigo-700
                flex items-center justify-center shrink-0 shadow-lg shadow-indigo-900/60">
      <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 3.741-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-7.007 11.55A5.981 5.981 0 0 0 6.75 15.75v-1.5"/>
      </svg>
    </div>
    <div class="leading-tight">
      <p class="text-white font-bold text-base tracking-tight">UniDash</p>
      <p class="text-[11px] text-slate-500 font-medium">Portale studenti</p>
    </div>
  </div>

  <!-- ── Navigation ── -->
  <nav class="flex-1 px-3 py-5 overflow-y-auto space-y-0.5">

    <p class="px-3 mb-3 text-[10px] font-semibold uppercase tracking-widest text-slate-600 select-none">
      Menu
    </p>

    <!-- Dynamic items — driven by nav.config.ts -->
    <a *ngFor="let item of navItems"
       [routerLink]="item.route"
       [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }"
       routerLinkActive="nav-active"
       class="nav-item">

      <!-- Icon -->
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path *ngFor="let p of item.paths"
              stroke-linecap="round" stroke-linejoin="round"
              [attr.d]="p"/>
      </svg>

      <!-- Label -->
      <span class="flex-1 truncate">{{ item.label }}</span>

      <!-- Optional badge -->
      <span *ngIf="item.badge" class="nav-badge">{{ item.badge }}</span>

    </a>
  </nav>

  <!-- ── User footer ── -->
  <div class="p-3 border-t border-white/5">
    <div class="flex items-center gap-3 px-2 py-2.5 rounded-xl
                hover:bg-white/5 transition-colors cursor-pointer group">

      <!-- Avatar -->
      <div class="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-500 to-indigo-700
                  flex items-center justify-center text-white font-bold text-xs shrink-0
                  shadow shadow-indigo-900/60 ring-2 ring-indigo-500/30">
        {{ initials() }}
      </div>

      <!-- Name + ID -->
      <div class="min-w-0 flex-1">
        <p class="text-sm font-semibold text-white truncate leading-tight">{{ displayName() }}</p>
        <p class="text-[11px] text-slate-500 truncate mt-0.5">{{ studentId() }}</p>
      </div>

      <!-- Settings gear -->
      <svg class="w-4 h-4 text-slate-600 group-hover:text-slate-300 transition-colors shrink-0"
           fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
      </svg>

    </div>
  </div>

</aside>
