<div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">

  <!-- Header row: title/subtitle on the left, optional action slot on the right -->
  <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
    <div>
      <h2 class="font-semibold text-slate-900">{{ title }}</h2>
      <p *ngIf="subtitle" class="text-xs text-slate-400 mt-0.5">{{ subtitle }}</p>
    </div>
    <!-- Parent can project a button, link, etc. here -->
    <ng-content select="[slot-action]"></ng-content>
  </div>

  <!-- Body: optionally wrapped in a horizontal-scroll container -->
  <div [ngClass]="scrollableX ? 'overflow-x-auto' : ''">
    <ng-content></ng-content>
  </div>

</div>
