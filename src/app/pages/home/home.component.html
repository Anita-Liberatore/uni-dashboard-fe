<app-page-header
  title="Welcome back, {{ student.name }}"
  subtitle="{{ student.area }} · Year {{ student.year }} · {{ student.studentId }} · Graduation {{ student.graduationDate }}">
</app-page-header>

<!-- Stat cards -->
<div class="grid grid-cols-2 xl:grid-cols-4 gap-4 mb-8">

  <app-stat-card
    value="29.8" suffix="/ 30"
    label="Average grade"
    badge="+0.3" badgeClass="text-emerald-600 bg-emerald-50"
    iconBg="bg-indigo-50"
    note="Excellent standing" noteClass="text-emerald-600">
    <svg slot-icon class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z"/>
    </svg>
  </app-stat-card>

  <app-stat-card
    value="53" suffix="/ 180"
    label="Credits earned"
    badge="29%" badgeClass="text-slate-500 bg-slate-100"
    iconBg="bg-emerald-50"
    [progress]="29.4" progressClass="bg-emerald-500">
    <svg slot-icon class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"/>
    </svg>
  </app-stat-card>

  <app-stat-card
    value="6" suffix="/ 22"
    label="Exams passed"
    badge="4 with honors" badgeClass="text-indigo-600 bg-indigo-50"
    iconBg="bg-sky-50">
    <svg slot-icon class="w-5 h-5 text-sky-600" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
    </svg>
  </app-stat-card>

  <app-stat-card
    value="16"
    label="Exams remaining"
    badge="Next: May" badgeClass="text-amber-600 bg-amber-50"
    iconBg="bg-amber-50">
    <svg slot-icon class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
    </svg>
  </app-stat-card>

</div>

<!-- Bottom columns -->
<div class="grid grid-cols-1 xl:grid-cols-5 gap-6">

  <!-- Recent exams (3/5) -->
  <div class="xl:col-span-3 bg-white rounded-xl shadow-sm border border-slate-100">
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
      <div>
        <h2 class="font-semibold text-slate-900">Recent exams</h2>
        <p class="text-xs text-slate-400 mt-0.5">Your latest results</p>
      </div>
      <a routerLink="/exams" class="text-xs font-medium text-indigo-600 hover:text-indigo-700">View all →</a>
    </div>
    <div class="divide-y divide-slate-50">
      <div *ngFor="let e of recentExams" class="flex items-center justify-between px-6 py-4">
        <div class="flex items-center gap-4">
          <!-- Grade square -->
          <div [ngClass]="gradeSquareClass(e.grade)"
               class="w-10 h-10 rounded-lg flex items-center justify-center font-bold text-sm shrink-0">
            {{ e.grade }}<span *ngIf="e.lode" class="text-xs">L</span>
          </div>
          <div>
            <p class="text-sm font-medium text-slate-800">{{ e.course }}</p>
            <p class="text-xs text-slate-400">{{ e.date }} · {{ e.credits }} credits</p>
          </div>
        </div>
        <span *ngIf="e.lode"
              class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">
          Honors
        </span>
      </div>
    </div>
  </div>

  <!-- Upcoming exams (2/5) -->
  <div class="xl:col-span-2 bg-white rounded-xl shadow-sm border border-slate-100 flex flex-col">
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
      <div>
        <h2 class="font-semibold text-slate-900">Upcoming exams</h2>
        <p class="text-xs text-slate-400 mt-0.5">Still to prepare</p>
      </div>
      <a routerLink="/study-plan" class="text-xs font-medium text-indigo-600 hover:text-indigo-700">Plan →</a>
    </div>
    <div class="divide-y divide-slate-50 flex-1">
      <div *ngFor="let e of upcomingExams" class="flex items-start gap-3 px-6 py-4">
        <div class="mt-1.5 w-2 h-2 rounded-full shrink-0"
             [ngClass]="e.urgent ? 'bg-red-400' : 'bg-slate-300'"></div>
        <div>
          <p class="text-sm font-medium text-slate-800">{{ e.course }}</p>
          <p class="text-xs text-slate-400 mt-0.5">{{ e.date }} · {{ e.credits }} credits</p>
        </div>
      </div>
    </div>
    <div class="px-6 py-4 border-t border-slate-50">
      <a routerLink="/study-plan"
         class="flex items-center justify-center gap-2 py-2 px-4 rounded-lg border border-slate-200 text-sm font-medium text-slate-600 hover:bg-slate-50 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z"/>
        </svg>
        View full study plan
      </a>
    </div>
  </div>

</div>
