<app-page-header
  title="Calendario"
  subtitle="Prossimi esami, scadenze e sessioni">
</app-page-header>

<!-- ── Summary chips ──────────────────────────────────────────────────────── -->
<div class="flex flex-wrap items-center gap-3 mb-6">

  <div class="flex items-center gap-2 bg-white border border-slate-100 rounded-lg px-4 py-2.5 shadow-xs">
    <span class="w-2 h-2 rounded-full bg-slate-300"></span>
    <span class="text-xs font-semibold text-slate-400">Totale</span>
    <span class="text-sm font-bold text-slate-800">{{ totalCount() }}</span>
  </div>

  <div class="flex items-center gap-2 bg-white border border-slate-100 rounded-lg px-4 py-2.5 shadow-xs">
    <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
    <span class="text-xs font-semibold text-slate-400">Esami</span>
    <span class="text-sm font-bold text-slate-800">{{ examCount() }}</span>
  </div>

  <div class="flex items-center gap-2 bg-white border border-slate-100 rounded-lg px-4 py-2.5 shadow-xs">
    <span class="w-2 h-2 rounded-full bg-amber-500"></span>
    <span class="text-xs font-semibold text-slate-400">Scadenze</span>
    <span class="text-sm font-bold text-slate-800">{{ deadlineCount() }}</span>
  </div>

  <div *ngIf="urgentCount() > 0"
       class="flex items-center gap-2 bg-amber-50 border border-amber-200 rounded-lg px-4 py-2.5 shadow-xs">
    <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
    <span class="text-xs font-semibold text-amber-600">Imminenti</span>
    <span class="text-sm font-bold text-amber-700">{{ urgentCount() }}</span>
  </div>

</div>

<!-- ── Filter tabs ─────────────────────────────────────────────────────────── -->
<app-pill-tabs
  [tabs]="filterTabs"
  [activeTab]="activeFilter()"
  (tabChange)="activeFilter.set($event)">
</app-pill-tabs>

<!-- ── Grouped events ──────────────────────────────────────────────────────── -->
<div *ngIf="eventGroups().length > 0; else empty" class="space-y-8">

  <div *ngFor="let group of eventGroups()">

    <!-- Month heading -->
    <div class="flex items-center gap-3 mb-3">
      <span class="text-xs font-bold text-slate-400 uppercase tracking-widest whitespace-nowrap">
        {{ group.month }}
      </span>
      <div class="flex-1 h-px bg-slate-100"></div>
      <span class="text-xs text-slate-400 whitespace-nowrap">
        {{ group.events.length }} {{ group.events.length === 1 ? 'evento' : 'eventi' }}
      </span>
    </div>

    <!-- Event cards -->
    <div class="space-y-3">
      <app-event-card
        *ngFor="let ev of group.events"
        [event]="ev">
      </app-event-card>
    </div>

  </div>

</div>

<!-- ── Empty state ─────────────────────────────────────────────────────────── -->
<ng-template #empty>
  <div class="flex flex-col items-center justify-center py-20 text-center">
    <div class="w-14 h-14 rounded-full bg-slate-100 flex items-center justify-center mb-4">
      <svg class="w-7 h-7 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1
             21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18
             0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/>
      </svg>
    </div>
    <p class="text-sm font-semibold text-slate-500">Nessun evento trovato</p>
    <p class="text-xs text-slate-400 mt-1">Prova a selezionare un altro filtro</p>
  </div>
</ng-template>
